# models.yaml — registry of all models considered across the research plan.
#
# Status tiers (mirror DECISIONS.md):
#   BASELINE     — currently in use, proven on our hardware
#   CANDIDATE    — active test item in TESTING_QUEUE.md
#   ELIMINATED   — decided against, see DECISIONS.md for rationale
#   REVIEW       — was decided on outdated single-GPU assumption; revisit if needed
#
# Field notes:
#   vram_gb:     AWQ weight size at TP=1. For TP=2, divide by 2 plus ~1 GiB allocator overhead per card.
#                bf16 sizes are not tracked here — we don't deploy bf16.
#   ctx_default: --max-model-len value; actual workable context depends on KV cache dtype and
#                concurrent model load (see ARCHITECTURE.md for TP=2 gpu-mem-util math).
#   engines:     engines known to *load* the model. Does not imply all features work (see notes).
#   flags.vllm:  SUPPLEMENTAL flags only. Do not include --model or --tensor-parallel-size;
#                these are managed by the deployment infrastructure scripts.

models:

  # ============================================================
  # CODER ROLE
  # ============================================================

  # ── BASELINE coder ─────────────────────────────────────────────────────
  qwen3_coder_30b_awq:
    status: BASELINE
    role: coder
    hf_repo: QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 18
    ctx_default: 32768
    engines: [vllm, sglang]
    # flags.vllm: space-separated flags passed verbatim to vLLM CLI. Use exact flag names from
    # `vllm serve --help`. Do not invent flag names — verify against your running vLLM version.
    flags:
      vllm: "--tool-call-parser qwen3_coder --reasoning-parser qwen3"
    measured:
      single_gpu_seq1_tps: 251
      single_gpu_c4_agg_tps: 730
      tool_call_pass_rate: 1.00
    notes: >
      Current coder baseline. See PHASE2_RESULTS.md. On TP=2 the expected decode is
      close to single-GPU (A3B MoE allreduce traffic is <2% of PCIe 5.0 x8 bandwidth).
      Concurrent dual-process on shared GPUs is test item T1.2.

  # ── CANDIDATE coder ────────────────────────────────────────────────────
  glm47_flash_awq:
    status: CANDIDATE
    role: coder
    hf_repo: cyankiwi/GLM-4.7-Flash-AWQ-4bit    # also cpatonn publishes
    quant: AWQ-INT4
    format: awq
    vram_gb: 18
    ctx_default: 65536        # aspirational with MLA; verify per T2.1
    engines: [vllm, sglang]
    flags:
      vllm: "--tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice"
    requires_vllm: ">=0.15.0"
    known_bugs:
      - "MLA auto-detection was broken at release (KV cache 10× bloated). One-line fix for glm4_moe_lite in model_arch_config_convertor.py. Verify per T2.1 before trusting benchmark numbers."
      - "MTP spec decode: 10× throughput regression reported on B200. Status on consumer Blackwell sm_120 unknown. Do NOT enable --speculative-config.method mtp without measuring via T3.2."
    test_items: [T2.1, T2.2, T3.2]
    notes: >
      30B-A3B MoE. Z.ai claims 59.2% SWE-bench Verified, 79.5% τ²-Bench.
      Their published comparison is against Qwen3-30B-A3B general, NOT our
      Qwen3-Coder-30B-A3B baseline — real gap vs our coder is unknown until T2.2.

  # ── REVIEW (decided on old single-GPU assumption) ──────────────────────
  qwen35_35b_a3b_awq:
    status: REVIEW
    role: coder
    hf_repo: QuantTrio/Qwen3.5-35B-A3B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 22
    ctx_default: 32768
    engines: [vllm]
    known_bugs:
      - "SGLang PERMANENTLY INCOMPATIBLE: qwen3_5.py:1662 weight-loader expects fused experts.w2_weight but QuantTrio stores per-expert tensors. Code bug, not config. Skip SGLang for this model until patched upstream."
      - "vLLM PR #39055 (think+tool drop): use --reasoning-parser qwen3 as workaround."
    why_review: >
      Eliminated at 22 t/s with --enforce-eager on SINGLE GPU because 22 GiB
      weights left <1 GiB headroom (CUDA graph profiling needs ~1.03 GiB, so
      graphs had to be disabled → 10× penalty). On TP=2, per-card weight load
      drops to ~11 GiB leaving ~16+ GiB per card for graphs + KV. The original
      failure reason does not apply to TP=2. Not currently a priority (our coder
      baseline is strong), but this model is not dead in principle. If revived,
      queue as new T-item.
    notes: >
      Keep the SGLang incompatibility note above — that is permanent until patched.

  # ============================================================
  # THINKER ROLE
  # ============================================================

  # ── BASELINE thinker (with caveat) ─────────────────────────────────────
  qwen35_27b_awq:
    status: BASELINE
    role: thinker
    hf_repo: QuantTrio/Qwen3.5-27B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 14
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--tool-call-parser qwen3_coder --reasoning-parser qwen3 --max-num-seqs 1"
    measured:
      single_gpu_seq1_tps: 76
      quality_mean_8task: 4.0
    outstanding_defect:
      - "th03_architecture_tradeoffs: <think> consistently exhausts 8192-token budget, empty output. Fix: raise to 16384 (test T1.4). Until fixed, route architecture-heavy tasks elsewhere."
    notes: >
      Hybrid SSM/transformer (Qwen3_5ForConditionalGeneration, GDN/FLA layers).
      --max-num-seqs 1 required to keep CUDA graphs active on single GPU (graph
      profiling with 51 batch sizes needs 1.53 GiB, but only 1.11 GiB free
      after 19.78 GiB load). On TP=2 with more headroom, higher --max-num-seqs
      may be viable — flag for T1.2 / T2.3.

  # ── CANDIDATE thinker ──────────────────────────────────────────────────
  glm45_air_awq:
    status: CANDIDATE
    role: thinker
    hf_repo: cpatonn/GLM-4.5-Air-AWQ-4bit
    quant: AWQ-INT4
    format: awq
    vram_gb: 55       # across TP=2 → ~28 GiB per card for weights alone
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--tool-call-parser glm45 --reasoning-parser glm45 --enable-auto-tool-choice"
    tp_constraints:
      - "AWQ group_size=64 → vLLM CompressedTensorsWNA16MarlinMoEMethod kernel caps tensor_parallel_size at 2. Fine for us (TP=2 is the target)."
      - "Does not fit alongside the coder at gpu-mem 0.40 each — would need ~0.55+ gpu-mem-util for thinker alone. Revisit concurrent-dual viability if picked."
    test_items: [T2.3]
    notes: >
      106B total / 12B active MoE. Hybrid thinking+non-thinking modes. Strong
      on tool invocation and agentic benchmarks per Z.ai tech report. Larger
      VRAM footprint than Qwen3.5-27B-AWQ means the concurrent-dual assumption
      needs re-validation if GLM-4.5-Air wins T2.3.

  # ── ELIMINATED thinker ─────────────────────────────────────────────────
  deepseek_r1_32b_awq:
    status: ELIMINATED
    role: thinker
    hf_repo: casperhansen/deepseek-r1-distill-qwen-32b-awq
    quant: AWQ-INT4
    format: awq
    vram_gb: 16
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--reasoning-parser deepseek_r1"
    measured:
      single_gpu_seq1_tps: 74
      quality_mean_8task: 2.6
    elimination_reason: >
      Quality 2.6/5 vs Qwen3.5-27B 4.0/5 across task categories — not marginally
      worse but structurally worse (surface fixes, wrong diagnoses, misses
      consistency-scenario points). TP=2 rehab not worth the cycles.

  # ============================================================
  # BEHEMOTH ROLE
  # ============================================================

  # ── CANDIDATE behemoth ─────────────────────────────────────────────────
  qwen3_coder_next_awq:
    status: CANDIDATE
    role: behemoth
    hf_repo: cyankiwi/Qwen3-Next-80B-A3B-Instruct-AWQ-4bit
    quant: AWQ-INT4
    format: awq
    vram_gb: 42       # across TP=2 → ~22 GiB per card
    ctx_default: 32768           # 262144 supported with VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    engines: [vllm]
    flags:
      # --gpu-memory-utilization is also passed explicitly to deploy.sh; listed here so the
      # model-level requirement is self-documenting. deploy.sh --gpu-mem-util takes precedence
      # if both are supplied — ensure they agree.
      vllm: "--tool-call-parser hermes --enable-auto-tool-choice --gpu-memory-utilization 0.95"
    env:
      - "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1                  # required: enables 262k context"
      - "VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1        # required: prevents OOM during CUDA graph capture at 0.95 gpu-mem"
    requires_vllm: ">=0.15.0"
    known_bugs:
      - "MTP (qwen3_next_mtp) spec decode: status on sm_120 unverified. Do not enable by default; test via T3.3."
    test_items: [T1.3, T2.4, T3.3]
    notes: >
      80B-A3B MoE with hybrid attention. Originally blocked because GGUF-only
      and bf16 doesn't fit one GPU. AWQ-4bit publication makes TP=2 deployment
      viable. Serves as the on-demand behemoth via Sleep Mode — kept asleep
      with gpu-mem-util 0.95, woken when the coder/thinker pair is insufficient.
      T1.3 showed 0.85 was insufficient for 32k context due to CUDA graph overhead.

  # ============================================================
  # ELIMINATED — do not re-add to queue without new reason
  # ============================================================

  devstral:
    status: ELIMINATED
    role: coder
    hf_repo: mistralai/Devstral-Small-2505
    quant: bf16
    format: bf16
    elimination_reason: >
      bf16 OOMs at 30.4 GiB single-GPU. Quantized variants available but quality
      is below Qwen3-Coder-30B-AWQ on our tasks, with minimal reasoning. No path
      to viability even on TP=2. See DECISIONS.md.

  # ============================================================
  # OBSOLETE ENTRIES (bf16 registry placeholders — removed from planning)
  # ============================================================
  # The following entries existed in the old registry only to document "bf16
  # doesn't fit" — which is not a useful criterion since we don't deploy bf16.
  # They are deliberately removed from this file. If the corresponding AWQ
  # entry above isn't sufficient, reintroduce with a specific deployment path.
  #
  #   qwen35_27b (bf16 placeholder)
  #   deepseek_r1_32b (bf16 placeholder)
  #   qwen35_35b_a3b_gguf (unsloth UD — not currently planned; see DECISIONS.md T4.2)
  #   qwen3_coder_next (bf16 placeholder — replaced by qwen3_coder_next_awq)