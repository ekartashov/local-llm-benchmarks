  # ── SUSPENDED behemoth — Core tier retired 2026-04-25 ──────────────────
  qwen3_coder_next_awq:
    status: SUSPENDED    # Core tier retired; Extended Arclight fills escalation role
    role: behemoth
    hf_repo: cyankiwi/Qwen3-Next-80B-A3B-Instruct-AWQ-4bit
    quant: AWQ-INT4
    format: awq
    vram_gb: 42       # across TP=2 → ~22 GiB per card
    ctx_default: 32768           # 262144 supported with VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
    engines: [vllm]
    flags:
      # --gpu-memory-utilization is also passed explicitly to deploy.sh; listed here so the
      # model-level requirement is self-documenting. deploy.sh --gpu-mem-util takes precedence
      # if both are supplied — ensure they agree.
      vllm: "--tool-call-parser hermes --enable-auto-tool-choice --gpu-memory-utilization 0.95"
    env:
      - "VLLM_ALLOW_LONG_MAX_MODEL_LEN=1                  # required: enables 262k context"
      - "VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1        # required: prevents OOM during CUDA graph capture at 0.95 gpu-mem"
    requires_vllm: ">=0.15.0"
    known_bugs:
      - "MTP (qwen3_next_mtp) spec decode: status on sm_120 unverified. Do not enable by default; test via T3.3."
    test_items: [T1.3, T2.4, T3.3]
    notes: >
      80B-A3B MoE with hybrid attention. Originally blocked because GGUF-only
      and bf16 doesn't fit one GPU. AWQ-4bit publication makes TP=2 deployment
      viable. Serves as the on-demand behemoth via Sleep Mode — kept asleep
      with gpu-mem-util 0.95, woken when the coder/thinker pair is insufficient.
      T1.3 showed 0.85 was insufficient for 32k context due to CUDA graph overhead.

