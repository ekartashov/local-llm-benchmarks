# models.yaml — registry of all models used across benchmark phases.
# Fields:
#   hf_repo:      HuggingFace repo id (used for huggingface-cli download)
#   quant:        quantization label
#   format:       awq | gguf | bf16
#   vram_gb:      estimated VRAM usage at default context (single GPU)
#   ctx_default:  default --max-model-len to pass to the engine
#   engines:      engines known to support this model
#   notes:        known issues or workarounds

models:

  # ── Primary coder (MoE, daily driver candidate) ───────────────────────────
  qwen35_35b_a3b_awq:
    hf_repo: QuantTrio/Qwen3.5-35B-A3B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 22
    ctx_default: 16384   # 32 GB GPU: only ~0.57 GiB free after model load; max viable ~26400
    engines: [vllm]      # SGLang: KeyError on w2_weight — MoE AWQ weight-map bug in current image
    notes: >
      Use --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enforce-eager on vLLM.
      --enforce-eager required: CUDA graph profiling (51 batch sizes) OOMs on 32 GB after 22 GiB model.
      SGLang PERMANENTLY INCOMPATIBLE: lmsysorg/sglang:latest qwen3_5.py load_weights() expects fused
      experts.w2_weight tensor but QuantTrio stores per-expert experts.N.w2.weight tensors.
      Neither --quantization awq_marlin nor any other runtime flag fixes this — it is a code bug in
      SGLang's qwen3_5.py:1662 weight loader. Patch required. Skip all SGLang tests for this model.
      Chat template may be broken on HF — use barubary's fixed template.
      vLLM PR #39055 (think+tool drop) workaround: --reasoning-parser qwen3.

  qwen35_35b_a3b_gguf:
    hf_repo: unsloth/Qwen3.5-35B-A3B-GGUF
    file: Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf
    quant: GGUF-Q4_K_XL (Unsloth UD)
    format: gguf
    vram_gb: 23
    ctx_default: 32768
    engines: [llamacpp]
    notes: >
      Unsloth UD quant — higher quality than standard Q4_K_M.
      Do NOT test spec decode (llama.cpp PR #20075).

  # ── Coder variant (30B MoE) ───────────────────────────────────────────────
  qwen3_coder_30b_awq:
    hf_repo: QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 20
    ctx_default: 65536
    engines: [vllm, sglang]

  # ── Peak / frontier coder (dense 80B — single GPU won't fit, needs swap) ──
  qwen3_coder_next:
    hf_repo: Qwen/Qwen3-Coder-Next
    quant: bf16
    format: bf16
    vram_gb: 160   # too large for single GPU — load in GGUF Q4 split or skip
    ctx_default: 32768
    engines: [vllm]
    notes: >
      Only viable as GGUF on llamacpp with full GPU offload (--n-gpu-layers 99).
      CPU inference is 5x slower than expected (llama.cpp issue #19480).

  # ── Thinker models ────────────────────────────────────────────────────────
  # NOTE: bf16 variants of 27B/32B models DO NOT fit in 32 GB GDDR7.
  #   Qwen3.5-27B bf16 = ~50 GiB weights (27B × 2 bytes), OOMs at 30.5 GiB loaded.
  #   R1-32B bf16 = ~60 GiB weights (32B × 2 bytes), OOMs at 30.6 GiB loaded.
  #   GPU has 31.33 GiB usable VRAM. AWQ INT4 is required (~13-16 GiB).

  qwen35_27b:
    hf_repo: Qwen/Qwen3.5-27B
    quant: bf16
    format: bf16
    vram_gb: 50   # CORRECTED: bf16 27B = ~50 GiB — does NOT fit in 32 GB GPU
    ctx_default: 32768
    engines: [vllm, sglang]
    notes: >
      bf16 DOES NOT FIT in 32 GB. Confirmed OOM at 30.5 GiB loaded (needs ~50 GiB total).
      Use AWQ INT4 variant instead (~13 GiB). See qwen35_27b_awq below.

  qwen35_27b_awq:
    hf_repo: QuantTrio/Qwen3.5-27B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 14
    ctx_default: 32768
    engines: [vllm]
    notes: >
      AWQ INT4 — loads 19.78 GiB. Hybrid SSM/transformer (Qwen3_5ForConditionalGeneration,
      GDN/FLA layers). Default vLLM CUDA graph profiling OOMs: 51 batch sizes need 1.53 GiB
      but only 1.11 GiB free. Fix: --max-num-seqs 1 limits profiling to 1 batch size (0.04 GiB
      actual), CUDA graphs active. CONFIRMED 76 t/s at max-num-seqs=1 (Phase 2.2, 2026-04-15).
      Use --tool-call-parser qwen3_coder --reasoning-parser qwen3 --max-num-seqs 1 on vLLM.
      Do NOT use --enforce-eager (cuts speed to 24 t/s).
      361k downloads/month. Same QuantTrio quantizer as qwen3_coder_30b_awq.

  deepseek_r1_32b:
    hf_repo: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    quant: bf16
    format: bf16
    vram_gb: 60   # CORRECTED: bf16 32B = ~60 GiB — does NOT fit in 32 GB GPU
    ctx_default: 32768
    engines: [vllm, sglang]
    notes: >
      bf16 DOES NOT FIT in 32 GB. Confirmed OOM at 30.6 GiB loaded (needs ~60 GiB total).
      Use AWQ INT4 variant instead (~16 GiB). See deepseek_r1_32b_awq below.

  deepseek_r1_32b_awq:
    hf_repo: casperhansen/deepseek-r1-distill-qwen-32b-awq
    quant: AWQ-INT4
    format: awq
    vram_gb: 16
    ctx_default: 32768
    engines: [vllm]
    notes: >
      AWQ INT4 — fits in 32 GB with ~15 GiB headroom.
      Architecture: Qwen2ForCausalLM. Use --reasoning-parser deepseek_r1 on vLLM.

  # ── Coding assistant alternative ──────────────────────────────────────────
  devstral:
    hf_repo: mistralai/Devstral-Small-2505
    quant: bf16
    format: bf16
    vram_gb: 24
    ctx_default: 32768
    engines: [vllm]
    notes: Phase 2.4 — verify tool-call reliability before committing.
