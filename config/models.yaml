# models.yaml — registry of all models considered across the research plan.
#
# Status tiers (mirror DECISIONS.md):
#   BASELINE     — currently in use, proven on our hardware
#   CANDIDATE    — active test item in TESTING_QUEUE.md
#   ELIMINATED   — decided against, see DECISIONS.md for rationale
#   REVIEW       — was decided on outdated single-GPU assumption; revisit if needed
#
# Field notes:
#   vram_gb:     AWQ weight size at TP=1. For TP=2, divide by 2 plus ~1 GiB allocator overhead per card.
#                bf16 sizes are not tracked here — we don't deploy bf16.
#   ctx_default: --max-model-len value; actual workable context depends on KV cache dtype and
#                concurrent model load (see ARCHITECTURE.md for TP=2 gpu-mem-util math).
#   engines:     engines known to *load* the model. Does not imply all features work (see notes).
#   flags.vllm:  SUPPLEMENTAL flags only. Do not include --model or --tensor-parallel-size;
#                these are managed by the deployment infrastructure scripts.

models:

  # ============================================================
  # CODER ROLE
  # ============================================================

  # ── BASELINE coder ─────────────────────────────────────────────────────
  qwen3_coder_30b_awq:
    status: BASELINE
    role: coder
    hf_repo: QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 18
    ctx_default: 32768
    engines: [vllm, sglang]
    # flags.vllm: space-separated flags passed verbatim to vLLM CLI. Use exact flag names from
    # `vllm serve --help`. Do not invent flag names — verify against your running vLLM version.
    flags:
      vllm: "--tool-call-parser qwen3_coder --reasoning-parser qwen3"
    measured:
      single_gpu_seq1_tps: 251
      single_gpu_c4_agg_tps: 730
      tool_call_pass_rate: 1.00
    notes: >
      Current coder baseline. See PHASE2_RESULTS.md. On TP=2 the expected decode is
      close to single-GPU (A3B MoE allreduce traffic is <2% of PCIe 5.0 x8 bandwidth).
      Concurrent dual-process on shared GPUs is test item T1.2.

  # ── CANDIDATE coder ────────────────────────────────────────────────────
  glm47_flash_awq:
    status: CANDIDATE
    role: coder
    hf_repo: cyankiwi/GLM-4.7-Flash-AWQ-4bit    # also cpatonn publishes
    quant: AWQ-INT4
    format: awq
    vram_gb: 18
    ctx_default: 65536        # aspirational with MLA; verify per T2.1
    engines: [vllm, sglang]
    flags:
      vllm: "--tool-call-parser glm47 --reasoning-parser glm45 --enable-auto-tool-choice"
    requires_vllm: ">=0.15.0"
    known_bugs:
      - "MLA auto-detection was broken at release (KV cache 10× bloated). Confirmed in T2.1 (2026-04-18) reporting 127.4 KB/token. Requires custom vLLM patch in model_arch_config_convertor.py."
      - "MTP spec decode: 10× throughput regression reported on B200. Status on consumer Blackwell sm_120 unknown. Do NOT enable --speculative-config.method mtp without measuring via T3.2."
    test_items: [T2.1, T2.2, T3.2]
    notes: >
      30B-A3B MoE. Z.ai claims 59.2% SWE-bench Verified, 79.5% τ²-Bench.
      Their published comparison is against Qwen3-30B-A3B general, NOT our
      Qwen3-Coder-30B-A3B baseline — real gap vs our coder is unknown until T2.2.

  # ── SUPERSEDED coder (replaced by PrismaQuant 2026-05-05) ──────────────────
  qwen36_35b_a3b_awq:
    status: SUPERSEDED
    role: coder
    hf_repo: cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
    quant: AWQ-INT4
    format: awq
    vram_gb: 23
    ctx_default: 32768
    engines: [vllm]
    flags:
      # Hot-pair mode (TP=1, concurrent with thinker on GPU1):
      vllm_tp1: "--tensor-parallel-size 1 --gpu-memory-utilization 0.90 --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-auto-tool-choice"
      # Extended Arclight mode (TP=2, thinker sleeping, big-context):
      vllm_tp2: "--tensor-parallel-size 2 --gpu-memory-utilization 0.90 --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-auto-tool-choice"
    placement:
      hot_pair: "tp=1 GPU0"
      extended: "tp=2 GPU0+1 (thinker sleeping)"
    measured:
      tp2_tps: 232.0          # manual T6.1 run 2026-04-25 with V1 disabled
      tp1_tps: null           # TP=1 with V1 disabled untested — expected ~237 t/s; T6.1 rerun needed
      quality_completion: 1.0 # manual T6.1 run 2026-04-25
    notes: >
      35B-A3B MoE-hybrid. SUPERSEDED by PrismaQuant variant (2026-05-05).
      While AWQ was faster at TP=2 (232 t/s), it suffered "Reasoning Collapse" at TP=1
      unless V1 engine was enabled. PrismaQuant at TP=1 on V1 engine provides
      the required logical stability for the Hot-pair role.

  # ── ACTIVE coder (SETTLED BENCH_23 2026-05-05) ──────────────────────────
  rdtand_qwen36_35b_prismaquant:
    status: ACTIVE
    role: coder
    hf_repo: rdtand/Qwen3.6-35B-A3B-PrismaQuant-4.75bit-vllm
    quant: PrismaQuant-4.75bit
    format: compressed-tensors
    vram_gb: 24                  # estimated runtime across TP=2 (~12 GB/GPU); 22 GB disk
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--trust-remote-code --tensor-parallel-size 1 --gpu-memory-utilization 0.90 --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-auto-tool-choice"
      env: "VLLM_USE_V1=1"
    quant_details:
      nvfp4_linears: 192
      mxfp8_linears: 45
      bf16_entries: 274
      calibration: "GPTQ-OBS + closed-form scale sweep, 0.33× RTN MSE"
    measured:
      single_gpu_seq1_tps_agg: 56.5   # BENCH_23 170250Z (aggregate incl. TTFT)
      single_gpu_seq1_tps_dec: 120.9  # BENCH_23 170250Z (decode only)
      n4_agg_tps: 459.3               # BENCH_23 170250Z
      n4_per_req_tps: 115.4           # 459.3 / 4
      mtp_n1_seq1_tps: 34.7           # BENCH_23b (-38.6%)
      mtp_n1_n4_tps: 227.2            # BENCH_23c tuned (-50.6% vs no-MTP)
      tool_call_pass_rate: 1.00       # BENCH_23b 5/5
    notes: >
      35B-A3B MoE-hybrid. SETTLED as production coder 2026-05-05 (BENCH_23/23b).
      Successfully resolved the TP=1 "Reasoning Collapse" by enforcing the V1 engine
      path with CUDA graph capture. MTP (speculative decoding) is logically stable
      at TP=1 (5/5 tool calls, BENCH_23b) but incurs a 38-51% throughput regression.
      Production config uses No-MTP (56.5 t/s agg N=1, 459 t/s agg N=4).
      AWQ TP=1 V1 fails tool calls (2/5, BENCH_23a) — PrismaQuant+V1 is the only
      reliable TP=1 configuration for this model family.

  # ── CANDIDATE coder: APEX GGUF variants (ik_llama.cpp, T_APEX1/T_APEX2) ─────
  #   APEX = Adaptive Precision for EXpert Models. MoE-aware mixed-precision GGUF.
  #   I-series = imatrix calibration (code+reasoning+tool-call data, not wikitext).
  #   Bypasses FlashInfer SM120 grouped GEMM bottleneck (uses ik_llama.cpp mul_mat).
  #   Engine: ik_llama.cpp main. All variants fit on GPU0 (32 GB) at ngl=999 (full GPU).
  #   Tool-call risk: must verify grammar/template-based think+tool parsing in ik_llama.cpp.
  qwen36_35b_a3b_apex_compact:
    status: CANDIDATE
    role: coder
    hf_repo: mudler/Qwen3.6-35B-A3B-APEX-GGUF
    quant: APEX-I-Compact
    format: gguf
    vram_gb: 17.3          # ngl=999 (all layers on GPU0). Leaves ~14.7 GB headroom.
    ctx_default: 32768
    engines: [ik_llama.cpp]
    flags:
      ik_llama: "-ngl 999 -t 32 -np 1 --no-mmap --kv-type q8_0"
      # --kv-type q8_0: fp8 KV cache (halves KV memory vs fp16, frees GPU0 for Convergence layers)
      # -ngl 999: all layers on GPU0 (model fits; 32 GB GDDR7 with ~14 GB headroom at q8_0 KV)
      # do NOT use -rtr: forces MoE mul_mat to CPU path (ik_llama.cpp known issue)
    apex_variant: I-Compact
    apex_kl_max: ~6.7_ppl   # beats UD-Q3_K_M quality
    bw_ceiling_tps: 103     # 1790 GB/s / 17.3 GB; actual ~80-95% of ceiling
    coload_projection:
      # with fp8 KV (~1.0 GB), GPU0 total: ~18.5 GB, headroom ~13.0 GB
      # GPU1 thinker headroom: ~2.5 GB (BENCH_21 measured)
      # combined Convergence VRAM: ~15.5 GB → ngl ≈ 81 layers
      convergence_ngl_est: 81
      convergence_tps_est: 10.0   # ~71% of isolated 13.99 t/s
    test_items: [T_APEX1, T_APEX2]
    notes: >
      PRIMARY optimization target (locked 2026-05-05). I-Compact + fp8 KV (q8_0) on GPU0.
      BW ceiling 103 t/s vs PQ vLLM 64 t/s; bypasses FlashInfer SM120 grouped GEMM
      bottleneck. With fp8 KV: GPU0 headroom ~13 GB + GPU1 headroom ~2.5 GB = ~15.5 GB
      for Convergence → ngl ≈ 81 layers → ~10 t/s (2.5× better than current 4.05 t/s
      co-load). Key risk: ik_llama.cpp think+tool parsing for Qwen3.6 (untested).

  qwen36_35b_a3b_apex_mini:
    status: CANDIDATE
    role: coder
    hf_repo: mudler/Qwen3.6-35B-A3B-APEX-GGUF
    quant: APEX-I-Mini
    format: gguf
    vram_gb: 14.3          # ngl=999. Leaves ~17.7 GB headroom — near full Convergence fit.
    ctx_default: 32768
    engines: [ik_llama.cpp]
    flags:
      ik_llama: "-ngl 999 -t 32 -np 1 --no-mmap"
    apex_variant: I-Mini
    bw_ceiling_tps: 125    # 1790 GB/s / 14.3 GB; most aggressive quality compression
    coload_projection:
      gpu0_headroom_mib: 17469
      convergence_ngl_est: 94    # ALL attention layers fit alongside I-Mini coder!
      convergence_tps_est: 13.5  # near-isolated performance
    test_items: [T_APEX1, T_APEX2]
    notes: >
      Stretch candidate. If quality (th02 + tool calls) holds, I-Mini enables the
      "golden topology": GPU0 = coder 14.3 GB + Convergence all-layers 16.9 GB = 31.2 GB
      (tight but fits). All three models at near-isolated TPS simultaneously.
      Quality floor unknown — must validate before promotion.

  qwen36_35b_a3b_apex_balanced:
    status: CANDIDATE
    role: coder
    hf_repo: mudler/Qwen3.6-35B-A3B-APEX-GGUF
    quant: APEX-I-Balanced
    format: gguf
    vram_gb: 25.6          # ngl=999. Largest; leaves ~6.4 GB for KV only.
    ctx_default: 32768
    engines: [ik_llama.cpp]
    flags:
      ik_llama: "-ngl 999 -t 32 -np 1 --no-mmap"
    apex_variant: I-Balanced
    apex_kl_max: 4.53      # best quality (beats Q8_0 on downstream tasks)
    bw_ceiling_tps: 70     # 1790 GB/s / 25.6 GB — similar to PQ ceiling
    test_items: [T_APEX1]
    notes: >
      Fallback if I-Compact quality is insufficient. Offers the lowest KL worst-case
      (4.53 — better than Q8_0 on downstream tasks). BW ceiling similar to PQ so
      TPS upside is smaller. Limited co-load headroom (~6.4 GB GPU0 headroom after
      model weights). Test only if I-Compact fails quality gate.

  # ── DEFERRED Convergence APEX (quality evaluation, post-T_APEX1) ────────────
  convergence_apex_397b:
    status: DEFERRED
    role: convergence
    hf_repo: mudler/Qwen3.5-397B-A17B-APEX-GGUF
    quant: APEX-non-I-variants
    format: gguf
    engines: [ik_llama.cpp]
    file_sizes:
      Compact: 187_GB    # start here if activated
      Quality: 243_GB
      Balanced: 289_GB
    tps_projection:
      # all variants larger than UD-IQ2_M (123 GB) → slower with --cpu-moe (DDR5 bound)
      Compact_tps: 9.2   # 13.99 × (123/187)
      Quality_tps: 7.1   # 13.99 × (123/243)
      Balanced_tps: 6.0  # 13.99 × (123/289)
    defer_reason: >
      Quality evaluation only — TPS will be 34-57% lower than UD-IQ2_M due to larger
      expert weights and DDR5 bandwidth limit. Worth testing only if Convergence output
      quality becomes a production bottleneck. Activate T_APEX4 when that threshold is hit.
      Start with Compact (187 GB, least TPS penalty). Do not download before T_APEX1 settled.
    test_items: [T_APEX4]

  # ── SUPERSEDED: old Qwen3.5-35B-A3B (kept as historical record only) ────
  qwen35_35b_a3b_awq:
    status: ELIMINATED
    role: coder
    hf_repo: QuantTrio/Qwen3.5-35B-A3B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 22
    ctx_default: 32768
    engines: [vllm]
    superseded_by: qwen36_35b_a3b_awq
    known_bugs:
      - "SGLang PERMANENTLY INCOMPATIBLE: qwen3_5.py:1662 weight-loader expects fused experts.w2_weight but QuantTrio stores per-expert tensors. Code bug, not config. Skip SGLang for this model until patched upstream."
      - "vLLM PR #39055 (think+tool drop): use --reasoning-parser qwen3 as workaround."
    elimination_reason: >
      Measured at 22 t/s with --enforce-eager on SINGLE GPU (22 GiB weights left
      <1 GiB headroom, below the ~1.03 GiB CUDA graph profiling needs → graphs
      disabled → 10× penalty). Qwen3.6-35B-A3B-AWQ (Apache 2.0, released
      2026-04-14) is the fresh-generation successor and the 35B-A3B candidate of
      record going forward. Do not revive this entry as a coder candidate — use
      qwen36_35b_a3b_awq instead.
    notes: >
      Kept only as a historical record for the single-GPU failure mode.
      The SGLang incompatibility note is permanent until patched upstream, and
      likely applies to the Qwen3.6 weights too — verify in T2.5 if SGLang is
      ever considered for Qwen3.6.

  # ============================================================
  # THINKER ROLE
  # ============================================================

  # ── SUPERSEDED thinker (fallback only) ─────────────────────────────────────
  qwen35_27b_awq:
    status: SUPERSEDED    # replaced by qwen36_27b_awq (SETTLED 2026-04-25, T2.4d)
    role: thinker
    hf_repo: QuantTrio/Qwen3.5-27B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 14
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--tool-call-parser qwen3_coder --reasoning-parser qwen3 --max-num-seqs 1"
    measured:
      single_gpu_seq1_tps: 76
      quality_mean_8task: 4.0
    outstanding_defect:
      - "th03_architecture_tradeoffs: <think> consistently exhausts budget (tested up to 16384 tokens in T1.4), empty output. Not a budget issue, likely a density/infinite-loop pathology. Route architecture-heavy tasks elsewhere."
    notes: >
      Hybrid SSM/transformer (Qwen3_5ForConditionalGeneration, GDN/FLA layers).
      --max-num-seqs 1 required to keep CUDA graphs active on single GPU (graph
      profiling with 51 batch sizes needs 1.53 GiB, but only 1.11 GiB free
      after 19.78 GiB load). On TP=2 with more headroom, higher --max-num-seqs
      may be viable — flag for T1.2 / T2.3.

  # ── ACTIVE thinker (SETTLED BENCH_12 2026-05-01) ────────────────────────────
  rdtand_qwen36_27b_prismaquant:
    status: ACTIVE    # production thinker — SETTLED BENCH_12 2026-05-01
    role: thinker
    hf_repo: rdtand/Qwen3.6-27B-PrismaQuant-5.5bit-vllm
    quant: PrismaQuant-5.5bit
    format: compressed-tensors   # NVFP4/MXFP8/BF16 mixed via vLLM compressed-tensors
    vram_gb: 27                  # measured runtime (27,612 MiB delta); 19 GB disk
    ctx_default: 32768
    engines: [vllm]              # vLLM 0.20.0 (V1 only engine); VLLM_USE_V1 env var is unknown/ignored
    flags:
      vllm: "--kv-cache-dtype fp8 --enable-chunked-prefill --max-num-seqs 4 --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-auto-tool-choice --hf-overrides '{\"architectures\":[\"Qwen3_5ForCausalLM\"]}' --speculative-config '{\"method\":\"mtp\",\"num_speculative_tokens\":3}'"
      # --hf-overrides: REQUIRED — model config.json declares VL architecture; overrides to
      #   text-only to prevent vision encoder init (causes compressed-tensors NotImplementedError)
      env: ""  # No V0/V1 flag needed — vLLM 0.20.0 only has V1; VLLM_USE_V1=0 is ignored
    quant_details:
      nvfp4_linears: 349
      mxfp8_linears: 35
      bf16_entries: 112
      calibration: "GPTQ-OBS + closed-form scale sweep, 0.33× RTN MSE"
      mtp_optimal_n: 3           # verified optimal on SM120 via BENCH_19
    publisher_trust: HIGH        # Rob Tand = original PrismaQuant author
    architecture_note: "DeltaNet layers explicitly handled in per-linear allocation"
    placement:
      tp: 1
      gpu: 1    # GPU1 (isolated, concurrent with coder on GPU0)
    requires_vllm: ">=0.19.0"
    requires:
      cuda: ">=13.0 for full NVFP4 kernel path (compute_120f) — without it falls back to marlin/cutlass"
      flashinfer: "0.6.5 with SM120 patches for optimal NVFP4 GEMM"
    measured:
      single_gpu_seq1_tps: 91.9    # BENCH_19 (MTP n=3)
      single_gpu_seq4_tps: 314.8   # BENCH_19 (MTP n=3)
      quality_mean_7task: null     # human_review.md scores not filled; qualitative parity confirmed
      th02_correct: true           # BENCH_19 verified reasoning not corrupted by MTP
      tool_call_pass_rate: 1.00    # BENCH_19 verified 5/5 pass under MTP
    test_items: [T_PQ1, BENCH_19]
    notes: >
      27B dense, GDN hybrid. SETTLED as production thinker (BENCH_12, updated BENCH_19).
      Supersedes Qwen3.6-27B-AWQ: quality at parity or better (sharper th02 EDF reasoning).
      BENCH_19 confirmed MTP n=3 completely erases the previous TPS regression (+79% gain)
      and critically does NOT break tool calling (unlike the Coder at TP=2 in BENCH_14).
      Running on vLLM 0.20.0 V1 engine (only engine available). Full NVFP4 path will
      further boost TPS when CUDA 13.0 FlashInfer SM120 kernel matures.

  # ── CANDIDATE thinker ──────────────────────────────────────────────────
  glm45_air_awq:
    status: CANDIDATE
    role: thinker
    hf_repo: cpatonn/GLM-4.5-Air-AWQ-4bit
    quant: AWQ-INT4
    format: awq
    vram_gb: 55       # across TP=2 → ~28 GiB per card for weights alone
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--tool-call-parser glm45 --reasoning-parser glm45 --enable-auto-tool-choice"
    tp_constraints:
      - "AWQ group_size=64 → vLLM CompressedTensorsWNA16MarlinMoEMethod kernel caps tensor_parallel_size at 2. Fine for us (TP=2 is the target)."
      - "Does not fit alongside the coder at gpu-mem 0.40 each — would need ~0.55+ gpu-mem-util for thinker alone. Revisit concurrent-dual viability if picked."
    test_items: [T2.3]
    notes: >
      Group_size=64 Marlin kernel caps TP=2 (perfect for us). Fits 64GB total VRAM
      with 9 GiB headroom for KV. 106B total / 12B active MoE. Hybrid
      thinking+non-thinking modes. Strong on tool invocation and agentic
      benchmarks per Z.ai tech report. Larger VRAM footprint than
      Qwen3.5-27B-AWQ means the concurrent-dual assumption needs re-validation
      if GLM-4.5-Air wins T2.3.


  # ── SUPERSEDED thinker (replaced by PrismaQuant 2026-05-01) ─────────────────
  qwen36_27b_awq:
    status: SUPERSEDED    # replaced by rdtand_qwen36_27b_prismaquant (BENCH_12 2026-05-01)
    role: thinker
    hf_repo: QuantTrio/Qwen3.6-27B-AWQ
    quant: AWQ-INT4
    format: awq
    vram_gb: 21
    ctx_default: 32768     # native 262144; limited for KV budget on single GPU
    engines: [vllm]
    flags:
      vllm: "--kv-cache-dtype fp8 --enable-chunked-prefill --max-num-seqs 4 --tool-call-parser qwen3_coder --reasoning-parser qwen3 --enable-auto-tool-choice"
      # --enable-chunked-prefill: REQUIRED — disabling causes Triton OOM at TP=1 (confirmed T2.4f)
      # --kv-cache-dtype fp8: verified correct in T2.4d (3/3 th02 correct)
      # --max-num-seqs 4: upgraded from 1 (T_PAR1 R30: 269 t/s at N=4, 4 MiB VRAM delta, no OOM)
    placement:
      tp: 1
      gpu: 1    # GPU1 (isolated, concurrent with coder on GPU0)
    requires_vllm: ">=0.19.0"
    requires_transformers: ">=5.5.4"   # check container image at deploy time
    architecture:
      type: dense
      layers: 64
      layout: "16 × (3 × Gated DeltaNet → FFN + 1 × Gated Attention → FFN)"
      mamba: false
      gdn: true    # Gated DeltaNet (GDN) hybrid — NOT Mamba, but also NOT pure Transformer
      kvcached_spec: "DeltaNetSpec (unsupported by kvcached v0.1.5)"
      vision: true # includes vision encoder; --language-model-only may shed it but not tested
    measured:
      single_gpu_seq1_tps: 77.4    # T2.4d
      quality_mean_8task: 4.875    # T2.4d run1, scored R17
      th02_correct_rate: "3/3"     # reproducible across both T2.4d result sets
    benchmarks:
      aime_2026: 0.941
      gpqa_diamond: 0.878
      mmlu_pro: 0.862
      swe_bench_verified: 0.772
    test_items: [T2.4, T2.4d]
    known_bugs:
      - "vLLM #40621 batch inference: affects multi-concurrent-request scenarios. Thinker now max-num-seqs=4 — monitor."
      - "vLLM #40756 MTP crash: does NOT apply to our config. Crash conditions: FP8 quant + TP=4 + n=5 + 25K+ tokens. We use AWQ + TP=1 + n=1. T_MTP1 unblocked on vLLM 0.19.0."
      - "vLLM #40725 TP=4 non-English corruption: TP=1 only — not applicable."
    notes: >
      27B dense, GDN hybrid. SETTLED as production thinker 2026-04-25.
      T2.4d: quality 4.875/5, th02 correct 3/3. Supersedes Qwen3.5-27B (4.0/5, no reasoning budget issues).
      TP=2 viability INCONCLUSIVE (T2.4e confounded — T2.4g queued as LOW priority curiosity).
      For production: TP=1 on GPU1 is the confirmed correct and architecturally preferred config.
      SUPERSEDED by rdtand_qwen36_27b_prismaquant (BENCH_12 2026-05-01) — quality parity at
      sharper algorithmic reasoning, accepted TPS regression (-26 to -33%). Keep as fallback.

  # ── CANDIDATE thinker (Qwopus SFT, lower priority) ──────────────────────
  qwopus36_27b_preview:
    status: CANDIDATE
    role: thinker
    hf_repo: Jackrong/Qwopus3.6-27B-v1-preview
    quant: BF16    # no AWQ available; serve BF16 TP=2 or wait for community GGUF
    format: safetensors
    vram_gb: 54    # BF16 27B; across TP=2 → ~27 GiB per card
    ctx_default: 32768
    engines: [vllm]
    flags:
      vllm: "--tool-call-parser qwen3_coder --reasoning-parser qwen3 --language-model-only --enable-auto-tool-choice"
    tp_constraints:
      - "BF16 requires TP=2 (54 GiB total). Must sleep coder before deploy. Same pattern as Core escalation."
      - "If community AWQ or GGUF released before T2.4b runs, prefer that over BF16 TP=2."
    test_items: [T2.4b]
