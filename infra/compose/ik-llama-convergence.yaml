# infra/compose/ik-llama-convergence.yaml
#
# Reference compose definition for the Convergence tier.
# Primary deployment path: ./infra/scripts/deploy.sh ikllamacpp convergence
#
# Prerequisites:
#   1. Binary built:     ./infra/scripts/build-ik-llama.sh
#   2. Runtime image:    podman build -f infra/Containerfile.ik-llama-runtime -t local-ik-llama:runtime .
#
# CPU-ONLY by design: no GPU device passthrough. Runs in parallel with Arclight
# (which fills both GPUs). CUDA runtime libs are still required by the binary
# (dynamic link), but no CUDA API calls are made with -ngl 0.

services:
  ik-llama-convergence:
    image: local-ik-llama:runtime
    # No 'runtime: nvidia' — CPU-only, no CDI device needed.
    environment:
      # NVIDIA_VISIBLE_DEVICES intentionally absent — CPU-only mode.
      IK_LLAMA_CONVERGENCE: "1"  # marker for log filtering
    command: >
      --model /models/${CONVERGENCE_MODEL}
      --port 8000
      --host 0.0.0.0
      -ngl 0
      --no-mmap
      -b 4096
      -ub 2048
      -t ${NTHREADS:-32}
      -c ${CTX_LEN:-16384}
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0
      --jinja
      ${EXTRA_ARGS:-}
    ports:
      - "${PORT_CONVERGENCE:-8002}:8000"
    volumes:
      - ${IK_LLAMA_BUILD_DIR:-/srv/ai/projects/ik_llama.cpp/build}:/app/build:ro
      - ${MODEL_CACHE:-/srv/ai/models}:/models:ro
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60          # 10 min: --no-mmap cold start reads 123GB from NVMe
      start_period: 300s
