services:
  vllm-gpu0:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${GPU_0_ID:-0}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
    command: >
      --model ${MODEL_ID}
      --port 8000
      --gpu-memory-utilization 0.90
      --max-model-len ${CTX_LEN:-32768}
      --enable-auto-tool-choice
      --tool-call-parser ${TOOL_CALL_PARSER:-qwen3_coder}
      ${EXTRA_ARGS:-}
    ports:
      - "${PORT_VLLM_GPU0:-30000}:8000"
    volumes:
      - ${MODEL_CACHE:-/data/models}:/root/.cache/huggingface
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
