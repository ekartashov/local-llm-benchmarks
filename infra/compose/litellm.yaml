# LiteLLM proxy for multi-model routing (Phase 3+)
# Expects litellm_config.yaml to be present at /workspace/config/litellm_config.yaml
services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: >
      --config /app/config/litellm_config.yaml
      --port 4000
      --detailed_debug
    ports:
      - "${PORT_LITELLM:-30100}:4000"
    volumes:
      - ./config:/app/config:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-local-dev}
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
